name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:

permissions:
  contents: read
  pull-requests: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Conventional PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6.1.4
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint with Biome
        run: npm run check

      - name: Check JavaScript syntax
        run: |
          git ls-files -z -- '*.js' | while IFS= read -r -d '' file; do
            node --check "$file"
          done

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run tests
        timeout-minutes: 10
        run: npm test
